name: Deploy CFDB to ECR

on:
  push:
    branches:
      - master

# AWS_REGION pins the ECR/ECS region for every step; MOVING_TAG is the
# environment-scoped, mutable tag the ECS task definitions reference. Each
# image is pushed to both the immutable :<sha> tag (audit + rollback) and
# this moving tag. Rolling the service re-pulls the moving tag, so shipping
# code needs no RegisterTaskDefinition / CloudFormation / iam:PassRole — only
# the cfdb-deploy role's existing ECR push + ecs:UpdateService permissions.
env:
  AWS_REGION: us-east-2
  MOVING_TAG: dev

jobs:
  build-and-deploy:
    if: github.repository == 'abdenlab/cfdb'
    runs-on: ubuntu-24.04
    permissions:
        id-token: write
        contents: read

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@50ac8dd1e1b10d09dac7b8727528b91bed831ac0 # v3.0.2
        with:
          role-to-assume: ${{ secrets.AWS_IAM_ROLE }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@f2e9fc6c2b355c1890b65e6f6f0e2ac3e6e22f78 # v2.1.2

      # Tag/push the API image to both the immutable :$SHA_TAG (traceable to a
      # commit, used for SHA-based rollback) and the moving :$MOVING_TAG the
      # backend task definition references. Rolling the API service re-pulls
      # :$MOVING_TAG, shipping this commit's code.
      - name: Build and push to ECR
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          REPOSITORY: cfdb
        run: |
          SHA_TAG=${GITHUB_SHA::8}
          docker build --file Dockerfile.api \
            --build-arg SETUPTOOLS_SCM_PRETEND_VERSION=0.0.0+$SHA_TAG \
            -t $REGISTRY/$REPOSITORY:$MOVING_TAG \
            -t $REGISTRY/$REPOSITORY:$SHA_TAG .
          docker push $REGISTRY/$REPOSITORY:$MOVING_TAG
          docker push $REGISTRY/$REPOSITORY:$SHA_TAG

      # Build the wool worker image (Dockerfile.wool), scan it, then push to
      # a separate ECR repository. Pinned to linux/amd64 because the image
      # bundles UCSC's x86_64-only bigBedToBed. The cfdb-wool repository must
      # exist in ECR (created out of band, like the cfdb repository).
      #
      # This step only builds + tags the image (:$SHA_TAG for audit/rollback
      # and the moving :$MOVING_TAG the worker task def references); the
      # "Push wool worker image" step below pushes both tags after the scan.
      - name: Build wool worker image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          REPOSITORY: cfdb-wool
        run: |
          SHA_TAG=${GITHUB_SHA::8}
          echo "WOOL_IMAGE=$REGISTRY/$REPOSITORY:$SHA_TAG" >> "$GITHUB_ENV"
          docker build --platform linux/amd64 --file Dockerfile.wool \
            --build-arg SETUPTOOLS_SCM_PRETEND_VERSION=0.0.0+$SHA_TAG \
            -t $REGISTRY/$REPOSITORY:$MOVING_TAG \
            -t $REGISTRY/$REPOSITORY:$SHA_TAG .

      # Fail the build on HIGH/CRITICAL OS/library vulnerabilities before the
      # image can reach ECR — the worker shells out to samtools/tabix/
      # bigBedToBed over untrusted upstream bytes.
      - name: Scan wool worker image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.WOOL_IMAGE }}
          format: table
          exit-code: "1"
          severity: HIGH,CRITICAL
          ignore-unfixed: true

      - name: Push wool worker image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          REPOSITORY: cfdb-wool
        run: |
          SHA_TAG=${GITHUB_SHA::8}
          docker push $REGISTRY/$REPOSITORY:$MOVING_TAG
          docker push $REGISTRY/$REPOSITORY:$SHA_TAG

      # Ship the new API code with the moving-tag pattern: the backend task
      # definition references :$MOVING_TAG, so forcing a new deployment
      # launches fresh Fargate tasks that re-pull the tag we just pushed.
      # This needs only ecs:UpdateService — no RegisterTaskDefinition,
      # CloudFormation, or iam:PassRole — so it runs entirely on the
      # cfdb-deploy role's existing permissions. CLUSTER/SERVICE come from
      # repo variables (vars.BACKEND_CLUSTER / vars.BACKEND_SERVICE).
      - name: Roll API service
        env:
          CLUSTER: ${{ vars.BACKEND_CLUSTER }}
          SERVICE: ${{ vars.BACKEND_SERVICE }}
        run: |
          aws ecs update-service \
            --region "$AWS_REGION" \
            --cluster "$CLUSTER" \
            --service "$SERVICE" \
            --force-new-deployment

      - name: Wait for API rollout
        env:
          CLUSTER: ${{ vars.BACKEND_CLUSTER }}
          SERVICE: ${{ vars.BACKEND_SERVICE }}
        run: |
          aws ecs wait services-stable \
            --region "$AWS_REGION" \
            --cluster "$CLUSTER" \
            --services "$SERVICE"

      # No ECS step for the worker fleet: the worker task definition also
      # references :$MOVING_TAG, and the workers are ephemeral — the next
      # EcsProvisioner RunTask (issued by the API role at workflow dispatch)
      # pulls the freshly-pushed image. Re-tagging :$MOVING_TAG above is the
      # whole worker deploy; there is no long-running worker service to roll.
