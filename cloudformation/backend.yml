AWSTemplateFormatVersion: "2010-09-09"
Description: >
  CFDB backend — ECS Fargate service behind an ALB with HTTPS,
  Route 53 DNS, and Secrets Manager integration for DocumentDB.

Parameters:
  NetworkStackName:
    Type: String
    Description: Name of the network stack
  DatabaseStackName:
    Type: String
    Description: Name of the database stack
  WorkersStackName:
    Type: String
    Description: Name of the workers stack (worker task def + S3 cache)
  ImageURI:
    Type: String
    Default: 605134458779.dkr.ecr.us-east-2.amazonaws.com/cfdb:dev
    Description: >
      ECR image URI for the CFDB API. Defaults to the moving :dev tag so
      the CI moving-tag deploy (force-new-deployment re-pulls :dev) stays
      the source of truth — a later infra `cloudformation deploy` that
      reuses this default will not clobber the live image back to an old
      SHA.
  WorkflowS3Prefix:
    Type: String
    Default: ""
    Description: >
      Optional key prefix the S3 cache prepends to every artifact key,
      letting one bucket host multiple environments (WORKFLOW_S3_PREFIX).
  DesiredCount:
    Type: Number
    Default: 1
    Description: Number of ECS tasks
  HostedZoneName:
    Type: String
    Default: vis-api.link
  HostedZoneId:
    Type: String
    Default: Z09477406JQAR0KB7G87
  DomainName:
    Type: String
    Default: cfdb.vis-api.link
  # ---------- Worker mTLS (optional, off by default) ----------
  # ARNs of Secrets Manager secrets holding the API's client-side PEM
  # material for mutual TLS on the API<->worker gRPC channel: the shared
  # CA cert (same secret the workers stack uses), the API leaf cert, and
  # its key. Leave all three empty (default) to dispatch over plaintext.
  # See the workers stack for the upstream-blocker caveat (wool does not
  # override the gRPC authority, so enforced mTLS over the ECS path does
  # not validate yet) — keep empty until that lands.
  ApiTlsCaSecretArn:
    Type: String
    Default: ""
    Description: Secrets Manager ARN of the shared CA certificate PEM.
  ApiTlsCertSecretArn:
    Type: String
    Default: ""
    Description: Secrets Manager ARN of the API client certificate PEM.
  ApiTlsKeySecretArn:
    Type: String
    Default: ""
    Description: Secrets Manager ARN of the API client private-key PEM.

Conditions:
  # mTLS is wired only when a CA secret ARN is supplied; otherwise the
  # cert Secrets and IAM render away and the template matches the
  # plaintext default.
  ApiMtlsEnabled: !Not [!Equals [!Ref ApiTlsCaSecretArn, ""]]

Resources:
  # ---------- Secrets ----------
  SyncApiKeySecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub "${AWS::StackName}-sync-api-key"
      Description: API key for the CFDB /sync endpoint
      GenerateSecretString:
        PasswordLength: 48
        ExcludePunctuation: true

  # ---------- ACM certificate ----------
  Certificate:
    Type: AWS::CertificateManager::Certificate
    Properties:
      DomainName: !Ref DomainName
      ValidationMethod: DNS
      DomainValidationOptions:
        - DomainName: !Ref DomainName
          HostedZoneId: !Ref HostedZoneId

  # ---------- ALB ----------
  LoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Scheme: internet-facing
      Type: application
      SecurityGroups:
        - Fn::ImportValue: !Sub "${NetworkStackName}-ALBSecurityGroupId"
      Subnets: !Split
        - ","
        - Fn::ImportValue: !Sub "${NetworkStackName}-PublicSubnetIds"
      LoadBalancerAttributes:
        - Key: idle_timeout.timeout_seconds
          Value: "30"
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-alb"

  TargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: !Sub "cfdb-tg"
      Port: 8000
      Protocol: HTTP
      TargetType: ip
      VpcId:
        Fn::ImportValue: !Sub "${NetworkStackName}-VpcId"
      HealthCheckPath: /health
      HealthCheckIntervalSeconds: 30
      HealthCheckTimeoutSeconds: 5
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-tg"

  HTTPSListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    DependsOn: LoadBalancer
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Port: 443
      Protocol: HTTPS
      SslPolicy: ELBSecurityPolicy-TLS13-1-2-2021-06
      Certificates:
        - CertificateArn: !Ref Certificate
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref TargetGroup

  HTTPRedirectListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    DependsOn: LoadBalancer
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: redirect
          RedirectConfig:
            Protocol: HTTPS
            Port: "443"
            StatusCode: HTTP_301

  # ---------- Route 53 ----------
  DNSRecord:
    Type: AWS::Route53::RecordSetGroup
    Properties:
      HostedZoneName: !Sub "${HostedZoneName}."
      RecordSets:
        - Name: !Ref DomainName
          Type: A
          AliasTarget:
            DNSName: !GetAtt LoadBalancer.DNSName
            HostedZoneId: !GetAtt LoadBalancer.CanonicalHostedZoneID
            EvaluateTargetHealth: false

  # ---------- ECS cluster ----------
  ECSCluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: !Sub "${AWS::StackName}-cluster"
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-cluster"

  # ---------- CloudWatch log group ----------
  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/ecs/${AWS::StackName}"
      RetentionInDays: 30

  # ---------- Task definition ----------
  TaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub "${AWS::StackName}-task"
      Cpu: "1024"
      Memory: "2048"
      NetworkMode: awsvpc
      RequiresCompatibilities:
        - FARGATE
      ExecutionRoleArn: !GetAtt ExecutionRole.Arn
      TaskRoleArn: !GetAtt TaskRole.Arn
      ContainerDefinitions:
        - Name: cfdb-api
          Image: !Ref ImageURI
          Essential: true
          PortMappings:
            - ContainerPort: 8000
              Protocol: tcp
          Environment:
            - Name: MONGODB_TLS_ENABLED
              Value: "true"
            - Name: MONGODB_RETRY_WRITES
              Value: "false"
            - Name: SYNC_DATA_DIR
              Value: /tmp/sync-data
            # Selects the "ecs" workflow profile (S3Cache + EcsDiscovery +
            # EcsProvisioner). ECS_CLUSTER reuses this stack's own cluster.
            - Name: ECS_CLUSTER
              Value: !Ref ECSCluster
            - Name: ECS_WORKER_TASK_DEFINITION
              Value:
                Fn::ImportValue: !Sub "${WorkersStackName}-WorkerTaskFamily"
            - Name: ECS_WORKER_SUBNETS
              Value:
                Fn::ImportValue: !Sub "${NetworkStackName}-PublicSubnetIds"
            - Name: ECS_WORKER_SECURITY_GROUPS
              Value:
                Fn::ImportValue: !Sub "${NetworkStackName}-WorkerSecurityGroupId"
            # Workers fetch upstream files over HTTPS; private subnets have
            # no NAT, so workers run in public subnets with a public IP.
            # Safe because the worker SG closes all inbound except 50051
            # from the API SG — the public IP is egress-only in practice.
            - Name: ECS_WORKER_ASSIGN_PUBLIC_IP
              Value: ENABLED
            - Name: WORKFLOW_S3_BUCKET
              Value:
                Fn::ImportValue: !Sub "${WorkersStackName}-CacheBucketName"
            - Name: WORKFLOW_S3_PREFIX
              Value: !Ref WorkflowS3Prefix
            - Name: AWS_REGION
              Value: !Ref AWS::Region
          # The cert PEMs (when mTLS is enabled) are injected as env vars
          # and written to files by the image entrypoint
          # (cfdb-tls-entrypoint.sh), which points CFDB_WORKER_TLS_CA/CERT/KEY
          # at them. Absent when disabled, leaving dispatch plaintext.
          Secrets: !If
            - ApiMtlsEnabled
            - - Name: DATABASE_URL
                ValueFrom:
                  Fn::ImportValue: !Sub "${DatabaseStackName}-ConnectionURLSecretArn"
              - Name: SYNC_API_KEY
                ValueFrom: !Ref SyncApiKeySecret
              - Name: CFDB_WORKER_TLS_CA_PEM
                ValueFrom: !Ref ApiTlsCaSecretArn
              - Name: CFDB_WORKER_TLS_CERT_PEM
                ValueFrom: !Ref ApiTlsCertSecretArn
              - Name: CFDB_WORKER_TLS_KEY_PEM
                ValueFrom: !Ref ApiTlsKeySecretArn
            - - Name: DATABASE_URL
                ValueFrom:
                  Fn::ImportValue: !Sub "${DatabaseStackName}-ConnectionURLSecretArn"
              - Name: SYNC_API_KEY
                ValueFrom: !Ref SyncApiKeySecret
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: ecs
          HealthCheck:
            Command:
              - CMD-SHELL
              - curl -f http://127.0.0.1:8000/health || exit 1
            Interval: 30
            Timeout: 5
            Retries: 3

  # ---------- ECS service ----------
  ECSService:
    Type: AWS::ECS::Service
    DependsOn:
      - HTTPSListener
      - HTTPRedirectListener
    Properties:
      Cluster: !Ref ECSCluster
      TaskDefinition: !Ref TaskDefinition
      DesiredCount: !Ref DesiredCount
      LaunchType: FARGATE
      DeploymentConfiguration:
        MaximumPercent: 200
        MinimumHealthyPercent: 100
      HealthCheckGracePeriodSeconds: 60
      EnableECSManagedTags: true
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED
          SecurityGroups:
            - Fn::ImportValue: !Sub "${NetworkStackName}-ECSSecurityGroupId"
          Subnets: !Split
            - ","
            - Fn::ImportValue: !Sub "${NetworkStackName}-PublicSubnetIds"
      LoadBalancers:
        - ContainerName: cfdb-api
          ContainerPort: 8000
          TargetGroupArn: !Ref TargetGroup
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-service"

  # ---------- IAM: execution role ----------
  ExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: execution
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - ecr:GetAuthorizationToken
                  - ecr:BatchCheckLayerAvailability
                  - ecr:GetDownloadUrlForLayer
                  - ecr:BatchGetImage
                Resource: "*"
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !GetAtt LogGroup.Arn
              - Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                Resource:
                  - Fn::ImportValue: !Sub "${DatabaseStackName}-ConnectionURLSecretArn"
                  - !Ref SyncApiKeySecret
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-execution-role"

  # mTLS cert access (optional). The execution role pulls the cert PEMs
  # injected via the container's Secrets; scope GetSecretValue to exactly
  # the three API cert ARNs. Only created when mTLS is enabled.
  ApiTlsSecretsPolicy:
    Type: AWS::IAM::Policy
    Condition: ApiMtlsEnabled
    Properties:
      PolicyName: api-tls-secrets
      Roles:
        - !Ref ExecutionRole
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action: secretsmanager:GetSecretValue
            Resource:
              - !Ref ApiTlsCaSecretArn
              - !Ref ApiTlsCertSecretArn
              - !Ref ApiTlsKeySecretArn

  # ---------- IAM: task role ----------
  # The API dispatches workflows to the worker fleet (EcsProvisioner
  # RunTask, EcsDiscovery ListTasks/DescribeTasks), passes the worker
  # roles to those tasks, and reads cached artifacts back from S3.
  TaskRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: workflow-dispatch
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: ecs:RunTask
                Resource: !Sub
                  - "arn:${AWS::Partition}:ecs:${AWS::Region}:${AWS::AccountId}:task-definition/${Family}:*"
                  - Family:
                      Fn::ImportValue: !Sub "${WorkersStackName}-WorkerTaskFamily"
                Condition:
                  ArnEquals:
                    ecs:cluster: !GetAtt ECSCluster.Arn
              # ListTasks doesn't support resource-level ARNs, but it does
              # honor the ecs:cluster condition key — scope it to this
              # cluster so the role can't enumerate tasks account-wide.
              - Effect: Allow
                Action: ecs:ListTasks
                Resource: "*"
                Condition:
                  ArnEquals:
                    ecs:cluster: !GetAtt ECSCluster.Arn
              - Effect: Allow
                Action: ecs:DescribeTasks
                Resource: !Sub "arn:${AWS::Partition}:ecs:${AWS::Region}:${AWS::AccountId}:task/${ECSCluster}/*"
                Condition:
                  ArnEquals:
                    ecs:cluster: !GetAtt ECSCluster.Arn
              - Effect: Allow
                Action: iam:PassRole
                Resource:
                  - Fn::ImportValue: !Sub "${WorkersStackName}-WorkerExecutionRoleArn"
                  - Fn::ImportValue: !Sub "${WorkersStackName}-WorkerTaskRoleArn"
                Condition:
                  StringEquals:
                    iam:PassedToService: ecs-tasks.amazonaws.com
        - PolicyName: cache-read
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: s3:GetObject
                Resource: !Sub
                  - "${BucketArn}/*"
                  - BucketArn:
                      Fn::ImportValue: !Sub "${WorkersStackName}-CacheBucketArn"
              - Effect: Allow
                Action: s3:ListBucket
                Resource:
                  Fn::ImportValue: !Sub "${WorkersStackName}-CacheBucketArn"
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-task-role"

Outputs:
  LoadBalancerDNSName:
    Value: !GetAtt LoadBalancer.DNSName
  ECSClusterName:
    Value: !Ref ECSCluster
    Export:
      Name: !Sub "${AWS::StackName}-ECSClusterName"
  ECSServiceName:
    Value: !GetAtt ECSService.Name
    Export:
      Name: !Sub "${AWS::StackName}-ECSServiceName"
