AWSTemplateFormatVersion: "2010-09-09"
Description: >
  CFDB network infrastructure — VPC with public subnets (ALB + ECS) and
  private subnets (DocumentDB) across two Availability Zones.

Parameters:
  CidrBlock:
    AllowedPattern: '((\d{1,3})\.){3}\d{1,3}/\d{1,2}'
    Default: 10.2.0.0/21
    Description: VPC CIDR block
    Type: String
  CidrPublicSubnetA:
    AllowedPattern: '((\d{1,3})\.){3}\d{1,3}/\d{1,2}'
    Default: 10.2.0.0/24
    Type: String
  CidrPublicSubnetB:
    AllowedPattern: '((\d{1,3})\.){3}\d{1,3}/\d{1,2}'
    Default: 10.2.1.0/24
    Type: String
  CidrPrivateSubnetA:
    AllowedPattern: '((\d{1,3})\.){3}\d{1,3}/\d{1,2}'
    Default: 10.2.2.0/24
    Type: String
  CidrPrivateSubnetB:
    AllowedPattern: '((\d{1,3})\.){3}\d{1,3}/\d{1,2}'
    Default: 10.2.3.0/24
    Type: String

Mappings:
  # Deterministic AZ-ID-to-name mapping (account-independent)
  RegionMap:
    us-east-1:
      ZoneId1: use1-az6
      ZoneId2: use1-az4
    us-east-2:
      ZoneId1: use2-az2
      ZoneId2: use2-az3
    us-west-1:
      ZoneId1: usw1-az1
      ZoneId2: usw1-az3
    us-west-2:
      ZoneId1: usw2-az1
      ZoneId2: usw2-az2
    eu-central-1:
      ZoneId1: euc1-az3
      ZoneId2: euc1-az2
    eu-west-1:
      ZoneId1: euw1-az1
      ZoneId2: euw1-az2
    eu-west-2:
      ZoneId1: euw2-az2
      ZoneId2: euw2-az3
    eu-west-3:
      ZoneId1: euw3-az1
      ZoneId2: euw3-az2
    eu-north-1:
      ZoneId1: eun1-az2
      ZoneId2: eun1-az1
    ca-central-1:
      ZoneId1: cac1-az2
      ZoneId2: cac1-az1
    eu-south-1:
      ZoneId1: eus1-az2
      ZoneId2: eus1-az1
    ap-east-1:
      ZoneId1: ape1-az3
      ZoneId2: ape1-az2
    ap-northeast-1:
      ZoneId1: apne1-az4
      ZoneId2: apne1-az1
    ap-northeast-2:
      ZoneId1: apne2-az1
      ZoneId2: apne2-az3
    ap-south-1:
      ZoneId1: aps1-az2
      ZoneId2: aps1-az3
    ap-southeast-1:
      ZoneId1: apse1-az1
      ZoneId2: apse1-az2
    ap-southeast-2:
      ZoneId1: apse2-az3
      ZoneId2: apse2-az1
    us-gov-west-1:
      ZoneId1: usgw1-az1
      ZoneId2: usgw1-az2
    ap-northeast-3:
      ZoneId1: apne3-az3
      ZoneId2: apne3-az2
    sa-east-1:
      ZoneId1: sae1-az3
      ZoneId2: sae1-az2
    af-south-1:
      ZoneId1: afs1-az3
      ZoneId2: afs1-az2
    ap-south-2:
      ZoneId1: aps2-az3
      ZoneId2: aps2-az2
    ap-southeast-3:
      ZoneId1: apse3-az3
      ZoneId2: apse3-az2
    ap-southeast-4:
      ZoneId1: apse4-az3
      ZoneId2: apse4-az2
    ca-west-1:
      ZoneId1: caw1-az3
      ZoneId2: caw1-az2
    eu-central-2:
      ZoneId1: euc2-az3
      ZoneId2: euc2-az2
    eu-south-2:
      ZoneId1: eus2-az3
      ZoneId2: eus2-az2
    il-central-1:
      ZoneId1: ilc1-az3
      ZoneId2: ilc1-az2
    me-central-1:
      ZoneId1: mec1-az3
      ZoneId2: mec1-az2

Resources:
  # ---------- VPC ----------
  VPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !Ref CidrBlock
      EnableDnsHostnames: true
      EnableDnsSupport: true
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-vpc"

  VPCFlowLog:
    Type: AWS::EC2::FlowLog
    Properties:
      ResourceId: !Ref VPC
      ResourceType: VPC
      TrafficType: ALL
      LogDestinationType: cloud-watch-logs
      LogGroupName: !Sub "${AWS::StackName}-VPCFlowLogs"
      DeliverLogsPermissionArn: !GetAtt FlowLogRole.Arn

  FlowLogRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: vpc-flow-logs.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: FlowLogPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                  - logs:DescribeLogGroups
                  - logs:DescribeLogStreams
                Resource: !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:${AWS::StackName}-VPCFlowLogs:*"

  InternetGateway:
    Type: AWS::EC2::InternetGateway

  AttachGateway:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref VPC
      InternetGatewayId: !Ref InternetGateway

  # ---------- AZ resolution ----------
  AvailabilityZone1:
    Type: Custom::AvailabilityZone
    DependsOn: LogGroupGetAZLambdaFunction
    Properties:
      ServiceToken: !GetAtt GetAZLambdaFunction.Arn
      ZoneId: !FindInMap [RegionMap, !Ref "AWS::Region", ZoneId1]

  AvailabilityZone2:
    Type: Custom::AvailabilityZone
    DependsOn: LogGroupGetAZLambdaFunction
    Properties:
      ServiceToken: !GetAtt GetAZLambdaFunction.Arn
      ZoneId: !FindInMap [RegionMap, !Ref "AWS::Region", ZoneId2]

  LogGroupGetAZLambdaFunction:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      LogGroupName: !Sub /aws/lambda/${GetAZLambdaFunction}
      RetentionInDays: 7

  GetAZLambdaFunction:
    Type: AWS::Lambda::Function
    Properties:
      Description: Resolve AZ ID to AZ name
      Timeout: 60
      Runtime: python3.9
      Handler: index.handler
      Role: !GetAtt GetAZLambdaRole.Arn
      Code:
        ZipFile: |
          import cfnresponse
          from json import dumps
          from boto3 import client
          EC2 = client('ec2')
          def handler(event, context):
              if event['RequestType'] in ('Create', 'Update'):
                  print(dumps(event, default=str))
                  data = {}
                  try:
                      response = EC2.describe_availability_zones(
                          Filters=[{'Name': 'zone-id', 'Values': [event['ResourceProperties']['ZoneId']]}]
                      )
                      print(dumps(response, default=str))
                      data['ZoneName'] = response['AvailabilityZones'][0]['ZoneName']
                  except Exception as error:
                      cfnresponse.send(event, context, cfnresponse.FAILED, {}, reason=str(error))
                      return
                  cfnresponse.send(event, context, cfnresponse.SUCCESS, data)
              else:
                  cfnresponse.send(event, context, cfnresponse.SUCCESS, {})

  GetAZLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action: sts:AssumeRole
            Principal:
              Service: !Sub "lambda.${AWS::URLSuffix}"
      ManagedPolicyArns:
        - !Sub "arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole"
      Policies:
        - PolicyName: DescribeAZs
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: ec2:DescribeAvailabilityZones
                Resource: "*"

  # ---------- Public subnets (ALB + ECS) ----------
  PublicSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: !Ref CidrPublicSubnetA
      AvailabilityZone: !GetAtt AvailabilityZone1.ZoneName
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-public-a"

  PublicSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: !Ref CidrPublicSubnetB
      AvailabilityZone: !GetAtt AvailabilityZone2.ZoneName
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-public-b"

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-public-rt"

  PublicRoute:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  PublicSubnetARouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnetA
      RouteTableId: !Ref PublicRouteTable

  PublicSubnetBRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnetB
      RouteTableId: !Ref PublicRouteTable

  # ---------- Private subnets (DocumentDB) ----------
  PrivateSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: !Ref CidrPrivateSubnetA
      AvailabilityZone: !GetAtt AvailabilityZone1.ZoneName
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-private-a"

  PrivateSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: !Ref CidrPrivateSubnetB
      AvailabilityZone: !GetAtt AvailabilityZone2.ZoneName
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-private-b"

  PrivateRouteTableA:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-private-rt-a"

  PrivateRouteTableB:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-private-rt-b"

  PrivateSubnetARouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnetA
      RouteTableId: !Ref PrivateRouteTableA

  PrivateSubnetBRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnetB
      RouteTableId: !Ref PrivateRouteTableB

  # ---------- Security groups ----------
  ALBSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: ALB - allow HTTP/HTTPS from internet
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - CidrIp: 0.0.0.0/0
          IpProtocol: tcp
          FromPort: 80
          ToPort: 80
        - CidrIp: 0.0.0.0/0
          IpProtocol: tcp
          FromPort: 443
          ToPort: 443
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-alb-sg"

  ECSSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: ECS tasks - allow 8000 from ALB, all egress
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 8000
          ToPort: 8000
          SourceSecurityGroupId: !Ref ALBSecurityGroup
      SecurityGroupEgress:
        - CidrIp: 0.0.0.0/0
          IpProtocol: "-1"
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-ecs-sg"

  DocumentDBSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: DocumentDB - allow 27017 from ECS only
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 27017
          ToPort: 27017
          SourceSecurityGroupId: !Ref ECSSecurityGroup
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-docdb-sg"

  # Workers accept gRPC 50051 from the API tasks (dispatched to a worker's
  # awsvpc IP). Egress is restricted to HTTPS (upstream file fetches and
  # the S3 gateway endpoint) and DNS: workers only ever fetch https:// URLs
  # (DRS resolves to HTTPS), so arbitrary-port egress is unnecessary.
  # Responses to the inbound gRPC connection are allowed statefully.
  WorkerSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Wool workers - allow 50051 from ECS; egress HTTPS + DNS
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 50051
          ToPort: 50051
          SourceSecurityGroupId: !Ref ECSSecurityGroup
      SecurityGroupEgress:
        - CidrIp: 0.0.0.0/0
          IpProtocol: tcp
          FromPort: 443
          ToPort: 443
        - CidrIp: 0.0.0.0/0
          IpProtocol: tcp
          FromPort: 53
          ToPort: 53
        - CidrIp: 0.0.0.0/0
          IpProtocol: udp
          FromPort: 53
          ToPort: 53
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-worker-sg"

  # ---------- DocumentDB subnet group ----------
  DocumentDBSubnetGroup:
    Type: AWS::DocDB::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: Private subnets for DocumentDB
      SubnetIds:
        - !Ref PrivateSubnetA
        - !Ref PrivateSubnetB
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-docdb-subnet-group"

  # ---------- S3 VPC endpoint ----------
  S3Endpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcEndpointType: Gateway
      ServiceName: !Sub "com.amazonaws.${AWS::Region}.s3"
      VpcId: !Ref VPC
      RouteTableIds:
        - !Ref PublicRouteTable
        - !Ref PrivateRouteTableA
        - !Ref PrivateRouteTableB

Outputs:
  VpcId:
    Value: !Ref VPC
    Export:
      Name: !Sub "${AWS::StackName}-VpcId"
  PublicSubnetIds:
    Value: !Join [",", [!Ref PublicSubnetA, !Ref PublicSubnetB]]
    Export:
      Name: !Sub "${AWS::StackName}-PublicSubnetIds"
  PrivateSubnetIds:
    Value: !Join [",", [!Ref PrivateSubnetA, !Ref PrivateSubnetB]]
    Export:
      Name: !Sub "${AWS::StackName}-PrivateSubnetIds"
  ALBSecurityGroupId:
    Value: !GetAtt ALBSecurityGroup.GroupId
    Export:
      Name: !Sub "${AWS::StackName}-ALBSecurityGroupId"
  ECSSecurityGroupId:
    Value: !GetAtt ECSSecurityGroup.GroupId
    Export:
      Name: !Sub "${AWS::StackName}-ECSSecurityGroupId"
  DocumentDBSecurityGroupId:
    Value: !GetAtt DocumentDBSecurityGroup.GroupId
    Export:
      Name: !Sub "${AWS::StackName}-DocumentDBSecurityGroupId"
  WorkerSecurityGroupId:
    Value: !GetAtt WorkerSecurityGroup.GroupId
    Export:
      Name: !Sub "${AWS::StackName}-WorkerSecurityGroupId"
  DocumentDBSubnetGroupName:
    Value: !Ref DocumentDBSubnetGroup
    Export:
      Name: !Sub "${AWS::StackName}-DocumentDBSubnetGroupName"
