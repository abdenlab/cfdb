AWSTemplateFormatVersion: "2010-09-09"
Description: >
  CFDB workflow workers — the ephemeral wool worker ECS task definition
  (run on demand by EcsProvisioner) and the S3 artifact cache the
  preprocessing/indexing pipeline writes to. Deploy after the network
  stack and before the backend stack: backend.yml imports the worker
  task family, worker role ARNs, and cache bucket from here. Tear down
  in reverse — delete the backend stack before this one, since those
  imports lock these exports — and empty the cache bucket first (see the
  CacheBucket DeletionPolicy note).

Parameters:
  WorkerImageURI:
    Type: String
    # NOTE: this default is dev-account/region-specific (account 605134458779,
    # region us-east-2). Override it for any other environment.
    Default: 605134458779.dkr.ecr.us-east-2.amazonaws.com/cfdb-wool:dev
    Description: >
      ECR image URI for the cfdb wool worker (Dockerfile.wool). Defaults to
      the moving :dev tag so the next EcsProvisioner RunTask pulls the
      freshly-pushed image. On a stack UPDATE, CloudFormation reuses the
      parameter's previous value, so this default only governs a fresh
      stack CREATE — a later infra `cloudformation deploy` will not clobber
      the worker image back to an old SHA.
  WorkerCpu:
    Type: String
    Default: "1024"
    Description: Fargate task CPU units for a worker (1024 = 1 vCPU)
  WorkerMemory:
    Type: String
    Default: "2048"
    Description: >
      Fargate task memory (MiB). 2048 is the Fargate minimum for 1 vCPU.
      The tools cfdb drives are memory-capped and spill to disk (samtools
      sort -m and GNU sort -S, both 256M by default), so peak RSS stays
      well under this; ephemeral storage, not memory, is the binding
      resource.
  WorkerEphemeralStorageGiB:
    Type: Number
    Default: 50
    MinValue: 21
    MaxValue: 200
    Description: >
      Fargate ephemeral storage (GiB) backing the per-job /tmp scratch
      workdir. Sized above the 20 GiB default for multi-hour sorts of
      large genomic files.
  CacheArtifactExpirationDays:
    Type: Number
    Default: 30
    MinValue: 1
    Description: >
      Days after which cached artifacts expire. Cache keys are
      content-addressed by upstream md5, so expiry is safe — a missing
      artifact is simply re-materialized on the next request.
  WorkerMaxLifetimeSeconds:
    Type: String
    Default: "18000"
    AllowedPattern: "^[0-9]+$"
    Description: >
      Hard ceiling on worker uptime (CFDB_WORKER_MAX_LIFETIME_SECONDS);
      one hour above the 4 h workflow duration cap so a worker started
      shortly before a long sort can still outlive the job.
  WorkerDrainGraceSeconds:
    Type: String
    Default: "120"
    AllowedPattern: "^[0-9]+$"
    Description: >
      Seconds /health returns 503 after SIGTERM before the gRPC port is
      torn down (CFDB_WORKER_DRAIN_GRACE_SECONDS).
  # ---------- Worker mTLS (optional, off by default) ----------
  # ARNs of Secrets Manager secrets holding the PEM material for mutual
  # TLS on the API<->worker gRPC channel. Supply the shared CA cert, the
  # worker leaf cert, and its key (each secret's plaintext value IS the
  # PEM). Leave all three empty (default) to run the channel plaintext —
  # the worker SG is the only access control in that case.
  #
  # The worker leaf cert MUST carry the backend stack's
  # WorkerTlsIdentity as a SAN. EcsDiscovery reaches each worker at the
  # awsvpc IP assigned at launch, so the API verifies against that
  # logical name rather than the dialed address; a cert without the SAN
  # fails the handshake. certs/generate-worker-certs.sh mints it by
  # default. There is no identity parameter on this stack — the worker
  # is the TLS server, and its half of the arrangement is the SAN.
  WorkerTlsCaSecretArn:
    Type: String
    Default: ""
    Description: Secrets Manager ARN of the shared CA certificate PEM.
  WorkerTlsCertSecretArn:
    Type: String
    Default: ""
    Description: Secrets Manager ARN of the worker leaf certificate PEM.
  WorkerTlsKeySecretArn:
    Type: String
    Default: ""
    Description: Secrets Manager ARN of the worker leaf private-key PEM.

Conditions:
  # mTLS is wired only when a CA secret ARN is supplied; otherwise every
  # mTLS resource below renders to AWS::NoValue and the template is
  # identical to the plaintext default.
  WorkerMtlsEnabled: !Not [!Equals [!Ref WorkerTlsCaSecretArn, ""]]

Resources:
  # ---------- S3 artifact cache ----------
  # DeletionPolicy/UpdateReplacePolicy are explicit Delete: the cache is
  # disposable (content-addressed by upstream md5, re-materialized on a
  # miss). NOTE: CloudFormation cannot delete a non-empty bucket, so a
  # stack delete (or a replacement-triggering update) fails until the
  # bucket is emptied — empty it before tearing down the stack.
  CacheBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      # SSE-S3 (AES256) is a deliberate choice over SSE-KMS: no per-request
      # KMS cost or key management. Revisit if the cached artifacts ever
      # need key-policy access control or CloudTrail data events.
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: expire-cached-artifacts
            Status: Enabled
            ExpirationInDays: !Ref CacheArtifactExpirationDays
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 7
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-cache"

  # Deny any non-TLS access to the cache at the bucket-policy layer so
  # artifact reads/writes are HTTPS-only regardless of caller IAM.
  CacheBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref CacheBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: "s3:*"
            Resource:
              - !GetAtt CacheBucket.Arn
              - !Sub "${CacheBucket.Arn}/*"
            Condition:
              Bool:
                aws:SecureTransport: "false"

  # ---------- CloudWatch log group ----------
  WorkerLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/ecs/${AWS::StackName}-worker"
      RetentionInDays: 30

  # ---------- IAM: worker execution role ----------
  # Pulls the image from ECR and writes container logs. The API task
  # role passes this role to the worker task via iam:PassRole at RunTask.
  WorkerExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: execution
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - ecr:GetAuthorizationToken
                  - ecr:BatchCheckLayerAvailability
                  - ecr:GetDownloadUrlForLayer
                  - ecr:BatchGetImage
                Resource: "*"
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !GetAtt WorkerLogGroup.Arn
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-worker-execution-role"

  # mTLS cert access (optional). The execution role — not the task role —
  # pulls Secrets Manager values injected via the container's Secrets,
  # so scope GetSecretValue to exactly the three cert ARNs. Only created
  # when mTLS is enabled.
  WorkerTlsSecretsPolicy:
    Type: AWS::IAM::Policy
    Condition: WorkerMtlsEnabled
    Properties:
      PolicyName: worker-tls-secrets
      Roles:
        - !Ref WorkerExecutionRole
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action: secretsmanager:GetSecretValue
            Resource:
              - !Ref WorkerTlsCaSecretArn
              - !Ref WorkerTlsCertSecretArn
              - !Ref WorkerTlsKeySecretArn

  # ---------- IAM: worker task role ----------
  # The processing routine runs in the worker and writes processed
  # artifacts to the cache (cache.head + cache.put), so the task role
  # needs read+write on the bucket. No delete: nothing in the request
  # path calls cache.delete.
  WorkerTaskRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: cache-access
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                Resource: !Sub "${CacheBucket.Arn}/*"
              - Effect: Allow
                Action:
                  - s3:ListBucket
                Resource: !GetAtt CacheBucket.Arn
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-worker-task-role"

  # ---------- Worker task definition ----------
  WorkerTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub "${AWS::StackName}-worker"
      Cpu: !Ref WorkerCpu
      Memory: !Ref WorkerMemory
      NetworkMode: awsvpc
      RequiresCompatibilities:
        - FARGATE
      # The worker image is pinned to linux/amd64 (Dockerfile.wool) because
      # UCSC publishes bigBedToBed only as a linux.x86_64 binary. Pin the
      # task to X86_64 Fargate capacity so samtools/bgzip/tabix and the
      # interpreter run native rather than emulated on arm64 hosts.
      RuntimePlatform:
        CpuArchitecture: X86_64
        OperatingSystemFamily: LINUX
      EphemeralStorage:
        SizeInGiB: !Ref WorkerEphemeralStorageGiB
      ExecutionRoleArn: !GetAtt WorkerExecutionRole.Arn
      TaskRoleArn: !GetAtt WorkerTaskRole.Arn
      ContainerDefinitions:
        - Name: cfdb-worker
          Image: !Ref WorkerImageURI
          Essential: true
          PortMappings:
            - ContainerPort: 50051
              Protocol: tcp
            - ContainerPort: 8080
              Protocol: tcp
          Environment:
            - Name: CFDB_WORKER_GRPC_PORT
              Value: "50051"
            - Name: CFDB_WORKER_HEALTH_PORT
              Value: "8080"
            - Name: CFDB_WORKER_MAX_LIFETIME_SECONDS
              Value: !Ref WorkerMaxLifetimeSeconds
            - Name: CFDB_WORKER_DRAIN_GRACE_SECONDS
              Value: !Ref WorkerDrainGraceSeconds
          # mTLS PEMs (optional). ECS injects each secret as an env var;
          # the image entrypoint (cfdb-tls-entrypoint.sh) writes them to
          # files and points CFDB_WORKER_TLS_CA/CERT/KEY at them. Absent
          # when mTLS is disabled, leaving the channel plaintext.
          Secrets: !If
            - WorkerMtlsEnabled
            - - Name: CFDB_WORKER_TLS_CA_PEM
                ValueFrom: !Ref WorkerTlsCaSecretArn
              - Name: CFDB_WORKER_TLS_CERT_PEM
                ValueFrom: !Ref WorkerTlsCertSecretArn
              - Name: CFDB_WORKER_TLS_KEY_PEM
                ValueFrom: !Ref WorkerTlsKeySecretArn
            - !Ref AWS::NoValue
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref WorkerLogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: ecs
          # Probes the aiohttp /health endpoint worker_main serves on the
          # health port. ECS must see HEALTHY before EcsDiscovery advertises
          # the task; without a healthCheck healthStatus stays UNKNOWN.
          HealthCheck:
            Command:
              - CMD-SHELL
              - curl -f http://127.0.0.1:8080/health || exit 1
            Interval: 30
            Timeout: 5
            Retries: 3
            # Grace window so boot-time probes don't transiently mark the
            # task UNHEALTHY (EcsDiscovery only advertises HEALTHY tasks);
            # mirrors the image HEALTHCHECK's --start-period.
            StartPeriod: 60
          # Match WorkerDrainGraceSeconds (default 120) so ECS does not
          # SIGKILL at the 30s Fargate default and cut the drain short.
          StopTimeout: 120

Outputs:
  WorkerTaskFamily:
    Value: !Sub "${AWS::StackName}-worker"
    Export:
      Name: !Sub "${AWS::StackName}-WorkerTaskFamily"
  WorkerTaskDefinitionArn:
    Value: !Ref WorkerTaskDefinition
    Export:
      Name: !Sub "${AWS::StackName}-WorkerTaskDefinitionArn"
  WorkerExecutionRoleArn:
    Value: !GetAtt WorkerExecutionRole.Arn
    Export:
      Name: !Sub "${AWS::StackName}-WorkerExecutionRoleArn"
  WorkerTaskRoleArn:
    Value: !GetAtt WorkerTaskRole.Arn
    Export:
      Name: !Sub "${AWS::StackName}-WorkerTaskRoleArn"
  CacheBucketName:
    Value: !Ref CacheBucket
    Export:
      Name: !Sub "${AWS::StackName}-CacheBucketName"
  CacheBucketArn:
    Value: !GetAtt CacheBucket.Arn
    Export:
      Name: !Sub "${AWS::StackName}-CacheBucketArn"
