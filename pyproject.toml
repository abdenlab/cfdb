[build-system]
build-backend = "setuptools.build_meta"
requires = ["setuptools>=64", "setuptools-scm>=8"]

[project]
authors = [{ name = "Conrad Bzura", email = "conradbzura@gmail.com" }]
classifiers = [
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "aiohttp",
    "boto3",
    # Matrix tile serving (issue #82). Was an optional extra gated
    # `python_version >= '3.12'` because the fork requires 3.12 while
    # cfdb still supported 3.11; now that the floor is 3.12, it is an
    # ordinary dependency like any other. `clodius` on public PyPI is a
    # different codebase from the fork this consumes — the public
    # releases carry no `tiles_v2` — which is why [tool.uv.sources]
    # below still pins it to a commit sha on the fork rather than
    # resolving the name from PyPI.
    "clodius",
    "click",
    "debugpy",
    "fastapi",
    "grpcio>=1.81.1",
    "motor",
    "pydantic>=2,<3",
    "pymongo",
    "requests",
    "strawberry-graphql",
    "uvicorn",
    # Compatible-release on 0.14 now that the final has shipped: patch
    # releases are picked up, 0.15 is not, since a minor bump may move
    # the wire protocol the dispatch channel depends on. Note that even
    # a patch move is a fleet-rejection event — wool admits a worker
    # only when the proxy's version is at most the worker's — so
    # refreshing the lock deliberately, and drain the fleet when it
    # moves (see README's version-bump deploy caveat).
    "wool~=0.14.0",
]
description = "A Python utility for parsing and normalizing various DCC datapackages."
dynamic = ["version"]
license = { text = "MIT License" }
name = "cfdb"
readme = { file = "README.md", content-type = "text/markdown" }
# Raised from >=3.11 to >=3.12 to carry clodius (issue #82's matrix tile
# backend) as an unconditional dependency instead of an optional extra —
# see the `dependencies` comment above. Every image already builds on
# python:3.12-slim-bookworm, so this does not change the runtime base;
# it only drops the promise that a 3.11 interpreter can install cfdb at
# all.
requires-python = ">=3.12"

[project.optional-dependencies]
dev = ["allpairspy", "cloudpickle", "cryptography", "debugpy", "httpx", "hypothesis", "mongomock-motor", "moto[ecs,s3]", "pytest-asyncio", "pytest-mock", "ruff"]

[tool.uv.sources]
# Pinned to a sha, not a branch: clodius considers ``tiles_v2`` unstable
# and cfdb is its first consumer, so what runs must be exactly what was
# validated. This sha is the tip of the fork's ``main`` — the
# 6-restore-dropped-guards branch (restored ``tiles_v2`` validation
# guards, see ``cfdb.tilesets.backend.ClodiusBackend.tile_error``, now
# bound to ``TilesetError``, and the tile-omission contract change
# documented on ``cfdb.tilesets.service.TilesetService._read_tiles``) has
# been merged there. Stay pinned to a commit sha rather than a branch
# reference regardless — a branch reference floats, and what runs must
# be exactly what was validated.
#
# ``main`` does not carry ``clodius.tiles_v2.hic`` — ``load_hic_tileset``
# degrades to ``TileBackendUnavailable`` for it. That's a no-op for cfdb
# today: ``.hic`` is refused at the call site regardless (see
# ``TilesetService._open_hic``) because the module reads local files
# only, which does not fit this corpus at any disk budget. Serving
# ``.hic`` at all is tracked as separate follow-up work, not something
# this pin is expected to grow.
clodius = { git = "https://github.com/abdenlab/clodius", rev = "07f043bea3380bbc38e76f0970d93abed0be4f69" }

[project.scripts]
cfdb = "cfdb.cli:cli"
cfdb-ensure-indexes = "cfdb.ensure_indexes:main"

[tool.pytest.ini_options]
addopts = ["--import-mode=importlib"]
# Include the repo root so ``tests.*`` resolves as a package — required
# by the wool cloudpickle-boundary integration test (the worker
# subprocess must be able to import ``tests.integration.routines`` to
# unpickle the StubProcessor instance dispatched to it).
pythonpath = ["src", "."]
markers = [
    "integration: slow or tool-dependent tests (e.g. samtools, htslib, real wool WorkerPool)",
]

[tool.setuptools_scm]
local_scheme = "dirty-tag"
version_scheme = "release-branch-semver"
