[build-system]
build-backend = "setuptools.build_meta"
requires = ["setuptools>=64", "setuptools-scm>=8"]

[project]
authors = [{ name = "Conrad Bzura", email = "conradbzura@gmail.com" }]
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "aiohttp",
    "boto3",
    "click",
    "debugpy",
    "fastapi",
    "grpcio>=1.81.1",
    "motor",
    "pydantic>=2,<3",
    "pymongo",
    "requests",
    "strawberry-graphql",
    "uvicorn",
    "wool==0.9.3",
]
description = "A Python utility for parsing and normalizing various DCC datapackages."
dynamic = ["version"]
license = { text = "MIT License" }
name = "cfdb"
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.11"

[project.optional-dependencies]
dev = ["allpairspy", "debugpy", "httpx", "hypothesis", "mongomock-motor", "moto[ecs,s3]", "pytest-asyncio", "pytest-mock", "ruff"]

[project.scripts]
cfdb = "cfdb.cli:cli"

[tool.pytest.ini_options]
addopts = ["--import-mode=importlib"]
# Include the repo root so ``tests.*`` resolves as a package — required
# by the wool cloudpickle-boundary integration test (the worker
# subprocess must be able to import ``tests.integration.routines`` to
# unpickle the StubProcessor instance dispatched to it).
pythonpath = ["src", "."]
markers = [
    "integration: slow or tool-dependent tests (e.g. samtools, htslib, real wool WorkerPool)",
]

[tool.setuptools_scm]
local_scheme = "dirty-tag"
version_scheme = "release-branch-semver"
