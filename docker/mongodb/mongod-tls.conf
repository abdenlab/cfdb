# MongoDB configuration for TLS/X.509 authentication
# Used in production mode when certificates are mounted

net:
  port: 27017
  bindIp: 0.0.0.0
  tls:
    mode: requireTLS
    certificateKeyFile: /etc/mongodb/certs/server-bundle.pem
    CAFile: /etc/mongodb/certs/ca.pem
    allowConnectionsWithoutCertificates: true

security:
  authorization: enabled

setParameter:
  authenticationMechanisms: MONGODB-X509
